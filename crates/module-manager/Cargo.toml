[package]
license = "MIT"
name = "lazybuddy-module-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
lazybuddy-module-contract = { path = "../module-contract" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ring = "0.17"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
ureq = { version = "3.5", default-features = false, features = ["native-tls", "win-system-proxy"] }
