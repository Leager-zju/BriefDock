[workspace]

[package]
name = "lazybuddy-shell-prototype"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression", "config-json5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazybuddy-module-contract = { path = "../../../crates/module-contract" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
codegen-units = 1
