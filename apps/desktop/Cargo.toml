[package]
license = "MIT"
name = "lazybuddy"
version = "2.0.0"
edition = "2024"

[build-dependencies]
find-msvc-tools = "=0.1.15"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "tokio", "image-without-codecs"] }
lazybuddy-module-contract = { path = "../../crates/module-contract" }
lazybuddy-module-manager = { path = "../../crates/module-manager" }
lazybuddy-service-client = { path = "../../crates/service-client" }
lazybuddy-host-control = { path = "../../crates/host-control" }
lazybuddy-media-ipc = { path = "../../crates/media-ipc", features = ["ui"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
ring = "0.17"
open = "5"
base64 = "0.22"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
