name: LazyBuddy checks

on:
  push:
    branches: [main, 'codex/lazybuddy-*']
    paths: ['apps/**', 'crates/**', 'contracts/**', 'scripts/**', 'assets/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'module-catalog.json', 'app-update-source.json', 'docs/updates/**', 'docs/modules/**', '.gitattributes', '.github/workflows/checks.yml']
  pull_request:
    paths: ['apps/**', 'crates/**', 'contracts/**', 'scripts/**', 'assets/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'module-catalog.json', 'app-update-source.json', 'docs/updates/**', 'docs/modules/**', '.gitattributes', '.github/workflows/checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Signing tool dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: lazybuddy-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Changed-feature unit tests
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/check-changes.py --base "$env:BASE_SHA"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  shell-prototype:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect prototype changes
        id: changed
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $base=$env:BASE_SHA
          if (!$base -or $base -match '^0+$') { $base='HEAD^' }
          $changed=@(git diff --name-only $base HEAD | Where-Object { $_ -like 'apps/shell-prototype/*' -or $_ -like 'crates/media-ipc/*' -or $_ -like 'crates/service-client/*' -or $_ -eq 'scripts/run-shell-prototype.ps1' })
          "run=$($changed.Count -gt 0)".ToLower() >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/shell-prototype/package-lock.json
      - uses: actions/cache@v4
        if: steps.changed.outputs.run == 'true'
        with:
          path: |
            ~/.cargo/registry
            target/qa-web-shell/build
          key: shell-${{ runner.os }}-${{ hashFiles('apps/shell-prototype/src-tauri/Cargo.lock') }}
      - name: Prototype-only checks
        if: steps.changed.outputs.run == 'true'
        working-directory: apps/shell-prototype
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/qa-web-shell/build
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
