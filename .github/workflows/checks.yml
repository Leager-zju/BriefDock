name: LazyBuddy checks

on:
  push:
    branches: [main, 'codex/lazybuddy-*']
    paths: ['apps/**', 'crates/**', 'contracts/**', 'scripts/**', 'assets/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'module-catalog.json', 'app-update-source.json', 'docs/updates/**', 'docs/modules/**', '.gitattributes', '.github/workflows/checks.yml']
  pull_request:
    paths: ['apps/**', 'crates/**', 'contracts/**', 'scripts/**', 'assets/**', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'module-catalog.json', 'app-update-source.json', 'docs/updates/**', 'docs/modules/**', '.gitattributes', '.github/workflows/checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Signing tool dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: lazybuddy-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - name: Changed-feature unit tests
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/check-changes.py --base "$env:BASE_SHA"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
